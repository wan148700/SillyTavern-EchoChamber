name: EchoChamber appearance
on:
  push:
    paths: ['style.css', 'index.js', 'appearance.js', 'tests/check-theme.cjs', '.github/workflows/ash-palette.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          node --check index.js
          node --check appearance.js
          mkdir -p theme-validation
          node tests/check-theme.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echochamber-palette-preview
          path: theme-validation/
